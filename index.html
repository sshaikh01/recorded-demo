<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorded demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="static-demo.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="side" id="side" aria-label="Main menu">
      <a class="brand" href="#/"><span class="mark"><i></i></span><span class="brand-text"><b data-brand style="font-weight:inherit">Demo</b> <span>Standards autopilot</span></span></a>
      <div class="runpick" id="runpick"></div>
      <nav class="side-nav" id="sidenav"></nav>
      <div class="side-foot">
        <span class="built"><i></i><span class="lbl">Built on Glass</span></span>
        <button class="collapse-btn" id="collapse" type="button" aria-label="Collapse the menu" title="Collapse the menu"></button>
      </div>
    </aside>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open the menu"></button>
    <div class="side-scrim" id="sideScrim"></div>
    <main id="view"></main>
  </div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-scrim" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true">
      <button class="drawer-close" data-close aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </div>
  </aside>
  <script type="module" src="static-demo.js"></script>
</body>
</html>
